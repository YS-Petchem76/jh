<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공조냉동 실습 3D 시뮬레이터 - 고급</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
            height: 100vh;
        }
        #container { width: 100%; height: 100%; display: flex; }
        #canvas { flex: 1; display: block; }
        #leftPanel, #rightPanel { background: rgba(0,0,0,0.7); padding: 15px; border: 1px solid #444; overflow-y: auto; }
        #leftPanel { width: 200px; max-height: 100vh; }
        #rightPanel { width: 250px; max-height: 100vh; }
        h3 { color: #4ecca3; margin-bottom: 10px; font-size: 14px; }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #3bb393; }
        button.active { background: #ff6b6b; }
        input, select { width: 100%; padding: 8px; background: #2a2a3e; color: #eee; border: 1px solid #444; border-radius: 3px; margin: 8px 0; }
        .stat {
            font-size: 12px;
            color: #aaa;
            padding: 8px;
            background: rgba(78, 204, 163, 0.1);
            border-left: 2px solid #4ecca3;
            margin: 8px 0;
            border-radius: 3px;
        }
        .message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #4ecca3;
            color: #1a1a2e;
            padding: 15px 30px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 200;
        }
        .inventory-item {
            background: #2a2a3e;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #4ecca3;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <div id="leftPanel">
            <h3>🛠️ 작업 선택</h3>
            <button id="task1" onclick="selectTask(1)">1️⃣ 동관 자르기</button>
            <button id="task2" onclick="selectTask(2)">2️⃣ 파이프 드릴링</button>
            <button id="task3" onclick="selectTask(3)">3️⃣ 부품 연결</button>
            <button id="task4" onclick="selectTask(4)">4️⃣ 황동용접</button>
            <button id="task5" onclick="selectTask(5)">5️⃣ 냉각</button>
            <button id="task6" onclick="selectTask(6)">6️⃣ 밴딩</button>
            <button id="task7" onclick="selectTask(7)">7️⃣ 플레어링</button>
            <button id="task8" onclick="selectTask(8)">8️⃣ 최종 용접</button>
            <h3 style="margin-top: 20px;">⚙️ 설정</h3>
            <div id="taskSettings"></div>
        </div>
        <div id="rightPanel">
            <h3>📊 상태</h3>
            <div class="stat"><strong>작업:</strong> <span id="currentTask">-</span></div>
            <div class="stat"><strong>완료:</strong> <span id="completedCount">0/8</span></div>
            <h3>📦 인벤토리</h3>
            <div id="inventory"></div>
            <h3>✨ 진행도</h3>
            <div id="progressBar" style="width: 100%; height: 20px; background: #2a2a3e; border-radius: 10px; overflow: hidden; margin-top: 10px;">
                <div id="progressFill" style="height: 100%; background: linear-gradient(90deg, #4ecca3, #ff6b6b); width: 0%; transition: width 0.3s;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 3D 장면 초기화
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a3e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 바닥
        const floorGeometry = new THREE.PlaneGeometry(30, 30);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 테이블
        const tableGeometry = new THREE.BoxGeometry(12, 0.2, 8);
        const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x8B7355 });
        const table = new THREE.Mesh(tableGeometry, tableMaterial);
        table.position.y = 1;
        table.castShadow = true;
        scene.add(table);

        // 상태 관리
        const state = {
            currentTask: 1,
            inventory: [],
            completedTasks: new Set(),
            isLoading: false,
            cuttingLength: 150,
            bendingAngle: 90,
            sceneObjects: []
        };

        // 메시지 표시
        function showMessage(text, duration = 2000) {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), duration);
        }

        // 진행도 업데이트
        function updateProgress() {
            const progress = (state.completedTasks.size / 8) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('completedCount').textContent = `${state.completedTasks.size}/8`;
            if (progress === 100) {
                showMessage('🎉 모든 작업 완료!', 3000);
            }
        }

        // 인벤토리 업데이트
        function updateInventory() {
            const inv = document.getElementById('inventory');
            inv.innerHTML = '';
            if (state.inventory.length === 0) {
                inv.innerHTML = '<p style="color: #aaa; font-size: 12px;">부품이 없습니다</p>';
                return;
            }
            state.inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inventory-item';
                div.textContent = `${item.type} × ${item.qty}`;
                inv.appendChild(div);
            });
        }

        // 장면에서 객체 제거
        function clearScene() {
            state.sceneObjects.forEach(obj => scene.remove(obj));
            state.sceneObjects = [];
        }

        // 작업 1: 동관 자르기
        function createCuttingUI() {
            document.getElementById('taskSettings').innerHTML = `
                <label>길이(mm): <span id="lengthValue">150</span></label>
                <input type="range" min="50" max="350" value="150" oninput="state.cuttingLength=this.value; document.getElementById('lengthValue').textContent=this.value;">
                <button onclick="executeCutting()">🔪 자르기</button>
            `;
        }

        function executeCutting() {
            if (state.isLoading) return;
            state.isLoading = true;
            clearScene();
            showMessage('동관을 자르는 중...', 2000);

            // 동관 생성
            const length = state.cuttingLength / 100;
            const tubeGeom = new THREE.CylinderGeometry(0.15, 0.15, length, 16);
            const tubeMat = new THREE.MeshStandardMaterial({ color: 0xB87333, metalness: 0.8, roughness: 0.2 });
            const tube = new THREE.Mesh(tubeGeom, tubeMat);
            tube.position.y = 1.3;
            tube.rotation.z = Math.PI / 2;
            tube.castShadow = true;
            scene.add(tube);
            state.sceneObjects.push(tube);

            // 인벤토리 추가
            const existing = state.inventory.find(i => i.type === `동관_${state.cuttingLength}mm`);
            if (existing) existing.qty++; else state.inventory.push({ type: `동관_${state.cuttingLength}mm`, qty: 1 });

            updateInventory();
            state.completedTasks.add(1);
            updateProgress();

            setTimeout(() => { state.isLoading = false; clearScene(); }, 2000);
        }

        // 작업 2: 파이프 드릴링
        function createDrillingUI() {
            document.getElementById('taskSettings').innerHTML = `
                <p style="font-size: 12px; color: #4ecca3;">파이프에 구멍을 뚫기</p>
                <button onclick="executeDrilling()">🔧 드릴링</button>
            `;
        }

        function executeDrilling() {
            if (state.isLoading) return;
            state.isLoading = true;
            clearScene();
            showMessage('파이프에 구멍을 뚫는 중... (3초)', 3000);

            // 파이프
            const pipeGeom = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.1 });
            const pipe = new THREE.Mesh(pipeGeom, pipeMat);
            pipe.position.y = 1.3;
            pipe.rotation.z = Math.PI / 2;
            pipe.castShadow = true;
            scene.add(pipe);
            state.sceneObjects.push(pipe);

            state.inventory.push({ type: '드릴링된_파이프', qty: 1 });
            updateInventory();
            state.completedTasks.add(2);
            updateProgress();

            setTimeout(() => { state.isLoading = false; clearScene(); }, 3000);
        }

        // 작업 3: 부품 연결
        function createConnectionUI() {
            document.getElementById('taskSettings').innerHTML = `
                <p style="font-size: 12px; color: #4ecca3;">부품 연결</p>
                <button onclick="executeConnection()">🔗 연결</button>
            `;
        }

        function executeConnection() {
            if (state.isLoading) return;
            state.isLoading = true;
            clearScene();
            showMessage('부품을 연결하는 중... (3초)', 3000);

            // 연결된 조립체
            const group = new THREE.Group();
            
            const tubeGeom = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 16);
            const tubeMat = new THREE.MeshStandardMaterial({ color: 0xB87333 });
            const tube = new THREE.Mesh(tubeGeom, tubeMat);
            tube.rotation.z = Math.PI / 2;
            tube.position.x = -0.75;
            group.add(tube);

            const pipeGeom = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const pipe = new THREE.Mesh(pipeGeom, pipeMat);
            pipe.rotation.z = Math.PI / 2;
            pipe.position.x = 0.5;
            group.add(pipe);

            group.position.y = 1.3;
            scene.add(group);
            state.sceneObjects.push(group);

            state.inventory = state.inventory.filter(i => !i.type.includes('동관') && !i.type.includes('파이프'));
            state.inventory.push({ type: '연결된_조립체', qty: 1 });
            updateInventory();
            state.completedTasks.add(3);
            updateProgress();

            setTimeout(() => { state.isLoading = false; clearScene(); }, 3000);
        }

        // 작업 4: 황동용접
        function createWeldingUI() {
            document.getElementById('taskSettings').innerHTML = `
                <p style="font-size: 12px; color: #4ecca3;">황동용접 (9초)</p>
                <button onclick="executeWelding()">🔥 용접</button>
            `;
        }

        function executeWelding() {
            if (state.isLoading) return;
            state.isLoading = true;
            clearScene();
            showMessage('황동용접 진행 중... (9초)', 9000);

            const group = new THREE.Group();
            
            const tubeGeom = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 16);
            const tubeMat = new THREE.MeshStandardMaterial({ color: 0xB87333 });
            const tube = new THREE.Mesh(tubeGeom, tubeMat);
            tube.rotation.z = Math.PI / 2;
            tube.position.x = -0.75;
            group.add(tube);

            const pipeGeom = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const pipe = new THREE.Mesh(pipeGeom, pipeMat);
            pipe.rotation.z = Math.PI / 2;
            pipe.position.x = 0.5;
            group.add(pipe);

            // 금색 용접선
            const weldGeom = new THREE.TorusGeometry(0.16, 0.02, 8, 8);
            const weldMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9 });
            const weld = new THREE.Mesh(weldGeom, weldMat);
            weld.rotation.y = Math.PI / 2;
            group.add(weld);

            group.position.y = 1.3;
            scene.add(group);
            state.sceneObjects.push(group);

            state.inventory = state.inventory.filter(i => i.type !== '연결된_조립체');
            state.inventory.push({ type: '용접된_조립체', qty: 1 });
            updateInventory();
            state.completedTasks.add(4);
            updateProgress();

            setTimeout(() => { state.isLoading = false; clearScene(); }, 9000);
        }

        // 작업 5: 냉각
        function createCoolingUI() {
            document.getElementById('taskSettings').innerHTML = `
                <p style="font-size: 12px; color: #4ecca3;">냉각 작업 (5초)</p>
                <button onclick="executeCooling()">💧 냉각</button>
            `;
        }

        function executeCooling() {
            if (state.isLoading) return;
            state.isLoading = true;
            clearScene();
            showMessage('냉각 작업 중... (5초)', 5000);

            // 물 양동이
            const bucketGeom = new THREE.CylinderGeometry(0.5, 0.5, 0.8, 16);
            const bucketMat = new THREE.MeshStandardMaterial({ color: 0x4169E1 });
            const bucket = new THREE.Mesh(bucketGeom, bucketMat);
            bucket.position.set(-4, 1, 0);
            bucket.castShadow = true;
            scene.add(bucket);
            state.sceneObjects.push(bucket);

            state.inventory = state.inventory.filter(i => i.type !== '용접된_조립체');
            state.inventory.push({ type: '냉각된_조립체', qty: 1 });
            updateInventory();
            state.completedTasks.add(5);
            updateProgress();

            setTimeout(() => { state.isLoading = false; clearScene(); }, 5000);
        }

        // 작업 6: 밴딩
        function createBendingUI() {
            document.getElementById('taskSettings').innerHTML = `
                <label>각도: <span id="angleValue">90</span>°</label>
                <input type="range" min="0" max="180" value="90" oninput="state.bendingAngle=this.value; document.getElementById('angleValue').textContent=this.value;">
                <button onclick="executeBending()">📐 밴딩</button>
            `;
        }

        function executeBending() {
            if (state.isLoading) return;
            state.isLoading = true;
            clearScene();
            showMessage(`${state.bendingAngle}° 밴딩 완료!`, 2000);

            // 밴딩된 동관 (곡선)
            const points = [];
            const angle = (state.bendingAngle * Math.PI) / 180;
            for (let i = 0; i <= 50; i++) {
                const t = i / 50;
                points.push(new THREE.Vector3(Math.sin(t * angle), 0, t * Math.cos(angle)));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeom = new THREE.TubeGeometry(curve, 20, 0.1, 8, false);
            const tubeMat = new THREE.MeshStandardMaterial({ color: 0xB87333 });
            const tube = new THREE.Mesh(tubeGeom, tubeMat);
            tube.position.y = 1.3;
            tube.castShadow = true;
            scene.add(tube);
            state.sceneObjects.push(tube);

            state.inventory.push({ type: `밴딩_${state.bendingAngle}°`, qty: 1 });
            updateInventory();
            state.completedTasks.add(6);
            updateProgress();

            setTimeout(() => { state.isLoading = false; clearScene(); }, 2000);
        }

        // 작업 7: 플레어링
        function createFlaringUI() {
            document.getElementById('taskSettings').innerHTML = `
                <p style="font-size: 12px; color: #4ecca3;">플레어링 작업</p>
                <button onclick="executeFlaring()">📢 플레어링</button>
            `;
        }

        function executeFlaring() {
            if (state.isLoading) return;
            state.isLoading = true;
            clearScene();
            showMessage('플레어링 완료!', 1500);

            const group = new THREE.Group();

            // 튜브
            const tubeGeom = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 16);
            const tubeMat = new THREE.MeshStandardMaterial({ color: 0xB87333 });
            const tube = new THREE.Mesh(tubeGeom, tubeMat);
            tube.rotation.z = Math.PI / 2;
            tube.position.x = -0.2;
            group.add(tube);

            // 플레어 (원뿔)
            const flareGeom = new THREE.ConeGeometry(0.25, 0.3, 16);
            const flareMat = new THREE.MeshStandardMaterial({ color: 0xB87333 });
            const flare = new THREE.Mesh(flareGeom, flareMat);
            flare.rotation.z = -Math.PI / 2;
            flare.position.x = 0.45;
            group.add(flare);

            group.position.y = 1.3;
            scene.add(group);
            state.sceneObjects.push(group);

            state.inventory.push({ type: '플레어링됨', qty: 1 });
            updateInventory();
            state.completedTasks.add(7);
            updateProgress();

            setTimeout(() => { state.isLoading = false; clearScene(); }, 1500);
        }

        // 작업 8: 최종 용접
        function createFinalWeldingUI() {
            document.getElementById('taskSettings').innerHTML = `
                <p style="font-size: 12px; color: #ff6b6b;"><strong>최종 작업</strong></p>
                <button onclick="executeFinalWelding()" style="background: #ff6b6b;">🔥 최종 용접 (10초)</button>
            `;
        }

        function executeFinalWelding() {
            if (state.isLoading) return;
            if (state.completedTasks.size < 7) {
                showMessage('이전 작업을 먼저 완료하세요', 2000);
                return;
            }
            state.isLoading = true;
            clearScene();
            showMessage('최종 용접 진행 중... (10초)', 10000);

            // 최종 조립체
            const group = new THREE.Group();

            const tubeGeom = new THREE.CylinderGeometry(0.15, 0.15, 2, 16);
            const tubeMat = new THREE.MeshStandardMaterial({ color: 0xB87333 });
            const tube = new THREE.Mesh(tubeGeom, tubeMat);
            tube.rotation.z = Math.PI / 2;
            tube.position.x = -0.5;
            group.add(tube);

            const pipeGeom = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const pipe = new THREE.Mesh(pipeGeom, pipeMat);
            pipe.rotation.z = Math.PI / 2;
            pipe.position.x = 0.5;
            group.add(pipe);

            const weldGeom = new THREE.TorusGeometry(0.16, 0.02, 8, 8);
            const weldMat = new THREE.MeshStandardMaterial({ color: 0xFFD700 });
            const weld = new THREE.Mesh(weldGeom, weldMat);
            weld.rotation.y = Math.PI / 2;
            group.add(weld);

            group.position.y = 1.3;
            scene.add(group);
            state.sceneObjects.push(group);

            state.inventory = [{ type: '✨ 최종_완성품', qty: 1 }];
            updateInventory();
            state.completedTasks.add(8);
            updateProgress();

            // 회전 애니메이션
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                group.rotation.y = (progress / 100) * Math.PI * 2;
                if (progress >= 100) {
                    clearInterval(interval);
                    state.isLoading = false;
                    clearScene();
                }
            }, 100);
        }

        // 작업 선택
        function selectTask(taskNum) {
            document.querySelectorAll('#leftPanel button').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === taskNum - 1);
            });
            
            state.currentTask = taskNum;
            document.getElementById('currentTask').textContent = `작업 ${taskNum}`;

            const uiLoaders = [
                createCuttingUI, createDrillingUI, createConnectionUI, createWeldingUI,
                createCoolingUI, createBendingUI, createFlaringUI, createFinalWeldingUI
            ];
            uiLoaders[taskNum - 1]();
        }

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // 윈도우 크기 조정
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 초기화
        selectTask(1);
        animate();
    </script>
</body>
</html>
